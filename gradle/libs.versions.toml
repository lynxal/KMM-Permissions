[versions]
agp = "9.4.0"
kotlin = "2.4.20"
android-appCompat = "1.8.0"
coroutines = "1.11.0"
voyager = "1.1.0-beta03"
logging = "0.0.7"

compose-multiplatform = "1.12.0"
androidx-lifecycle = "2.11.0"
androidx-activityCompose = "1.13.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"


[libraries]
android-appCompat = { module = "androidx.appcompat:appcompat", version.ref = "android-appCompat" }
android-lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycleViewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycleRuntimeCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }

logging = { module = "com.lynxal.logging:logging", version.ref = "logging" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }